        html, body {

            justify-content: center;
            min-height: 100vh;
            padding: 0;

            /* Same width, padding and gap as the page + columns below, so

                position: fixed;
                z-index: 5;
                top: clamp(1.2rem, 3.5vh, 2rem);
                left: 0;
                right: 0;
                display: flex;
                max-width: 100rem;
                margin: 0 auto;
                padding: 0 clamp(2rem, 5vw, 5rem);

        }

        @media (max-width: 640px) {

    <script>
        (function () {
            // Each wheel keeps its own progress and only reacts to
            // scroll/touch input while the pointer is over it, so spinning
            // one column never affects the other.
            var STEP = 40; // degrees between adjacent tiles — must match the --a spacing in the HTML

            var wheelEls = document.querySelectorAll(".wheel");
            wheelEls.forEach(function (wheel) {
                // Bind scroll/touch to the whole column, not just the 3D
                // wheel box — tiles project outside that box via perspective,
                // so a narrower hit area caused a stutter the moment the
                // cursor crossed off the (invisible) inner boundary.
                var hitArea = wheel.closest(".wheel-column") || wheel;
                // Read each tile's base angle once up front — calling
                // getComputedStyle() on every tile on every animation frame
                // (as this used to) forces a style recalc each time and was
                // a real source of jank, especially on mobile.
                var tiles = Array.prototype.map.call(wheel.querySelectorAll(".wheel-tile"), function (tile) {
                    return { el: tile, base: parseFloat(tile.style.getPropertyValue("--a")) || 0 };
                });
                var progress = 0;
                var target = 0;
                var velocity = 0;
                var mode = "idle"; // "follow" | "coast" | "magnet"
                var snapTimeout = null;
                var snapFrame = null;

                function apply() {
                    wheel.style.setProperty("--wheel-offset", progress + "deg");

                    // Fade + "magnetize" tiles based on distance from front-center:
                    // the closest tile grows slightly (slot-machine snap feel) while
                    // the ones rotating away shrink back and fade so they don't
                    // visually bleed through the front-facing tile.
                    tiles.forEach(function (t) {
                        var effective = ((t.base + progress) % 360 + 540) % 360 - 180;
                        var absEffective = Math.abs(effective);
                        var fade = Math.max(0, 1 - absEffective / 70);
                        var magnet = Math.max(0, 1 - absEffective / (STEP / 2));
                        t.el.style.opacity = fade;
                        t.el.style.setProperty("--tile-scale", (1 + magnet * 0.18).toFixed(3));
                        t.el.style.pointerEvents = fade < 0.15 ? "none" : "";
                    });
                }

                function stopSnap() {
                    if (snapFrame) {
                        cancelAnimationFrame(snapFrame);
                        snapFrame = null;
                    }
                }

                function runFollow() {
                    // Eases progress toward the raw scroll target instead of
                    // jumping straight to it — a physical mouse wheel sends
                    // input in big discrete notches (a trackpad's are tiny
                    // and frequent), so without this, each notch — and
                    // especially a reversal — snaps instantly instead of
                    // gliding.
                    mode = "follow";
                    var lastTime = null;
                    (function step(time) {
                        if (mode !== "follow") return;
                        if (lastTime === null) lastTime = time;
                        var dt = Math.min((time - lastTime) / (1000 / 60), 3) || 1;
                        lastTime = time;

                        var prev = progress;
                        progress += (target - progress) * Math.min(1, 0.35 * dt);
                        velocity = progress - prev;
                        apply();

                        snapFrame = requestAnimationFrame(step);
                    })();
                }

                function runMagnet() {
                    mode = "magnet";
                    // Find the smallest rotation delta that brings any one
                    // tile's effective angle exactly to 0 — the tiles aren't
                    // necessarily phased on multiples of STEP from 0, so this
                    // checks each tile's own base angle rather than assuming
                    // a fixed grid.
                    var bestDelta = 0;
                    tiles.forEach(function (t) {
                        var raw = -t.base - progress;
                        var delta = ((raw % 360) + 540) % 360 - 180;
                        if (Math.abs(delta) < Math.abs(bestDelta) || bestDelta === 0) {
                            bestDelta = delta;
                        }
                    });
                    var snapTarget = progress + bestDelta;

                    // Damped spring pulling the (by now nearly stopped)
                    // wheel the rest of the way onto the nearest tile.
                    var lastTime = null;
                    (function step(time) {
                        if (lastTime === null) lastTime = time;
                        var dt = Math.min((time - lastTime) / (1000 / 60), 3) || 1;
                        lastTime = time;

                        var diff = snapTarget - progress;
                        velocity = (velocity + diff * 0.02 * dt) * Math.pow(0.72, dt);
                        progress += velocity * dt;
                        apply();

                        if (Math.abs(diff) < 0.05 && Math.abs(velocity) < 0.02) {
                            progress = snapTarget;
                            target = progress;
                            velocity = 0;
                            apply();
                            snapFrame = null;
                            return;
                        }
                        snapFrame = requestAnimationFrame(step);
                    })();
                }

                function runCoast() {
                    mode = "coast";
                    // Keeps spinning on its own momentum once you stop
                    // scrolling/lift the mouse, slowly losing speed to
                    // friction, then hands off to the magnet once it's
                    // basically stopped.
                    var lastTime = null;
                    (function step(time) {
                        if (lastTime === null) lastTime = time;
                        var dt = Math.min((time - lastTime) / (1000 / 60), 3) || 1;
                        lastTime = time;

                        velocity *= Math.pow(0.965, dt);
                        progress += velocity * dt;
                        apply();

                        if (Math.abs(velocity) < 0.12) {
                            velocity = 0;
                            snapFrame = null;
                            runMagnet();
                            return;
                        }
                        snapFrame = requestAnimationFrame(step);
                    })();
                }

                function scheduleSnap() {
                    clearTimeout(snapTimeout);
                    snapTimeout = setTimeout(function () {
                        stopSnap();
                        runCoast();
                    }, 120);
                }

                hitArea.addEventListener("wheel", function (e) {
                    e.preventDefault();
                    if (mode !== "follow") {
                        target = progress; // resync — coast/magnet moved progress without updating target
                        stopSnap();
                        runFollow();
                    }
                    target += e.deltaY * 0.06;
                    scheduleSnap();
                }, { passive: false });

                var touchX = null;
                var touchY = null;
                var touchAxis = null; // "vertical" rotates the wheel, "horizontal" is left for the page to swipe between reels
                hitArea.addEventListener("touchstart", function (e) {
                    touchX = e.touches[0].clientX;
                    touchY = e.touches[0].clientY;
                    touchAxis = null;
                    stopSnap();
                    clearTimeout(snapTimeout);
                    target = progress;
                }, { passive: true });
                hitArea.addEventListener("touchmove", function (e) {
                    if (touchY === null) return;
                    var x = e.touches[0].clientX;
                    var y = e.touches[0].clientY;
                    var dx = touchX - x;
                    var dy = touchY - y;

                    // Decide once per gesture, on the first move that's
                    // clearly one direction or the other, so a horizontal
                    // swipe (switch reel) and a vertical one (spin this
                    // reel) never fight each other mid-gesture.
                    if (touchAxis === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
                        touchAxis = Math.abs(dy) > Math.abs(dx) ? "vertical" : "horizontal";
                    }
                    touchX = x;
                    touchY = y;

                    // Stay hands-off until the axis is actually decided (lets
                    // the page's native horizontal scroll-snap take over for
                    // horizontal swipes) — calling preventDefault too early,
                    // before we know the direction, would suppress that
                    // native scroll for the rest of the gesture even if it
                    // turns out to be horizontal.
                    if (touchAxis !== "vertical") return;

                    target += dy * 0.3;
                    if (mode !== "follow") {
                        stopSnap();
                        runFollow();
                    }
                    e.preventDefault();
                }, { passive: false });
                hitArea.addEventListener("touchend", function () {
                    touchX = null;
                    touchY = null;
                    touchAxis = null;
                    scheduleSnap();
                });

                apply();
            });

            // Mobile pagination dots + fixed title — reflect whichever reel
            // is currently centered in the horizontal swipe.
            var track = document.querySelector(".wheel-columns");
            var dots = document.querySelectorAll(".wheel-dot");
            var titles = document.querySelectorAll(".wheel-index");
            var mobileTitle = document.querySelector(".wheel-title-mobile");
            if (track && dots.length) {
                track.addEventListener("scroll", function () {
                    var index = Math.round(track.scrollLeft / track.clientWidth);
                    dots.forEach(function (dot, i) {
                        dot.classList.toggle("is-active", i === index);
                    });
                    if (mobileTitle && titles[index]) {
                        mobileTitle.textContent = titles[index].textContent;
                    }
                }, { passive: true });
            }
        })();
    </script>
